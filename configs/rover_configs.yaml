logger:
  # The lowest level of printing allowed.
  level: ${ROVER_LOGGER_LEVEL:INFO}
  # Comma separated list of modules(name prefix) to elevate to the debug level
  # regardless of the level above, e.g. "accesslog.collector.ztunnel". Keeps the
  # high volume modules quiet(bounding the logging allocation) while still getting
  # debug detail for the modules under investigation.
  debug_modules: ${ROVER_LOGGER_DEBUG_MODULES:}

core:
  # The name of the cluster.
  cluster_name: ${ROVER_CORE_CLUSTER_NAME:}
  backend:
    # The backend server address
    addr: ${ROVER_BACKEND_ADDR:localhost:11800}
    # The TLS switch
    enable_TLS: ${ROVER_BACKEND_ENABLE_TLS:false}
    # The file path of client.pem. The config only works when opening the TLS switch.
    client_pem_path: ${ROVER_BACKEND_PEM_PATH:}
    # The file path of client.key. The config only works when opening the TLS switch.
    client_key_path: ${ROVER_BACKEND_KEY_PATH:}
    # InsecureSkipVerify controls whether a client verifies the server's certificate chain and host name.
    insecure_skip_verify: ${ROVER_BACKEND_INSECURE_SKIP_VERIFY:false}
    # The file path oca.pem. The config only works when opening the TLS switch.
    ca_pem_path: ${ROVER_BACKEND_CA_PEM_PATH:}
    # How frequently to check the connection(second)
    check_period: ${ROVER_BACKEND_CHECK_PERIOD:5}
    # The auth value when send request
    authentication: ${ROVER_BACKEND_AUTHENTICATION:}

process_discovery:
  # The period of report or keep alive process(second)
  heartbeat_period: ${ROVER_PROCESS_DISCOVERY_HEARTBEAT_PERIOD:20s}
  # The agent sends the process properties to the backend every: heartbeart period * properties report period
  properties_report_period: ${ROVER_PROCESS_DISCOVERY_PROPERTIES_REPORT_PERIOD:10}
  kubernetes:
    # Is active the kubernetes process detector
    active: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ACTIVE:true}
    # Current node name in kubernetes environment
    node_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_NODE_NAME:}
    # include namespaces, multiple namespace split by ",", if empty means including all namespaces
    namespaces: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_NAMESPACES:}
    analyzers:
      - active: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_ACTIVE:true}
        filters:
          - ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_HAS_ENVOY:.Pod.HasContainer "istio-proxy"}
          - ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_CONTAINER_IS_ENVOY:eq .Container.Name "istio-proxy"}
        layer: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_LAYER:MESH_DP}
        service_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_SERVICE_NAME:{{.Pod.LabelValue "service.istio.io/canonical-name,app.kubernetes.io/name,app" ""}}.{{.Pod.Namespace}}}
        instance_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_INSTANCE_NAME:{{.Pod.Name}}}
        process_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_PROCESS_NAME:{{.Process.ExeName}}}
        labels: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_ENVOY_LABELS:mesh-envoy}
      - active: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_ACTIVE:true}
        filters:
          - ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_HAS_ENVOY:.Pod.HasContainer "istio-proxy"}
          - ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_CONTAINER_NOT_ENVOY:ne .Container.Name "istio-proxy"}
        layer: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_LAYER:MESH}
        service_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_SERVICE_NAME:{{.Pod.LabelValue "service.istio.io/canonical-name,app.kubernetes.io/name,app" ""}}.{{.Pod.Namespace}}}
        instance_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_INSTANCE_NAME:{{.Pod.Name}}}
        process_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_PROCESS_NAME:{{.Process.ExeName}}}
        labels: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_ISTIO_APPLICATION_LABELS:mesh-application}
      - active: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_ACTIVE:true}
        filters:
          - ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_HAS_SERVICE:.Pod.HasServiceName}
        layer: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_LAYER:K8S_SERVICE}
        service_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_NAME:{{.Pod.ServiceName}}.{{.Pod.Namespace}}}
        instance_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_INSTANCE_NAME:{{.Pod.Name}}}
        process_name: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_PROCESS_NAME:{{.Process.ExeName}}}
        labels: ${ROVER_PROCESS_DISCOVERY_KUBERNETES_ANALYZER_K8S_SERVICE_LABLES:k8s-service}

profiling:
  # Is active the process profiling
  active: ${ROVER_PROFILING_ACTIVE:true}
  # Check the profiling task interval
  check_interval: ${ROVER_PROFILING_CHECK_INTERVAL:10s}
  # Combine existing profiling data and report to the backend interval
  flush_interval: ${ROVER_PROFILING_FLUSH_INTERVAL:5s}
  # Customize profiling task config
  task:
    # The way to unwind the user space stack in the ON_CPU/OFF_CPU profiling task
    # "auto": using the "dwarf" when any native module of the process has the call frame information(.eh_frame)
    #         and is built without the frame pointer, otherwise using the "frame_pointer"
    # "dwarf": copy the user stack to rover and unwind it by the call frame information(.eh_frame),
    #          it works when the binaries/libraries built without the frame pointer, falls back to the "frame_pointer" when not supported
    # "frame_pointer": only unwind the stack by the frame pointer in the kernel, it has lower overhead but loses frames
    #                  when the binaries/libraries built without the frame pointer
    user_stack_unwind: ${ROVER_PROFILING_TASK_USER_STACK_UNWIND:auto}
    # The config when executing ON_CPU profiling task
    on_cpu:
      # The profiling stack dump period
      dump_period: ${ROVER_PROFILING_TASK_ON_CPU_DUMP_PERIOD:9ms}
    network:
      # The interval of send metrics to the backend
      report_interval: ${ROVER_PROFILING_TASK_NETWORK_TOPOLOGY_REPORT_INTERVAL:2s}
      # The prefix of network profiling metrics name
      meter_prefix: ${ROVER_PROFILING_TASK_NETWORK_TOPOLOGY_METER_PREFIX:rover_net_p}
      # The protocol analyzer config for 7-Layer
      protocol_analyze:
        # The size of socket data buffer on each CPU
        per_cpu_buffer: ${ROVER_PROFILING_TASK_NETWORK_PROTOCOL_ANALYZE_PER_CPU_BUFFER:400KB}
        # The count of parallel protocol analyzer
        parallels: ${ROVER_PROFILING_TASK_NETWORK_PROTOCOL_ANALYZE_PARALLELS:2}
        # The size of per paralleled analyzer queue
        queue_size: ${ROVER_PROFILING_TASK_NETWORK_PROTOCOL_ANALYZE_QUEUE_SIZE:5000}
        # The profiling config of the protocols
        sampling:
          # The HTTP/1.x and HTTP/2.x profiling config
          http:
            # The default body encoding when sampling the request
            default_request_encoding: ${ROVER_PROFILING_TASK_NETWORK_PROTOCOL_ANALYZE_SAMPLING_HTTP_DEFAULT_REQUEST_ENCODING:UTF-8}
            # The default body encoding when sampling the response
            default_response_encoding: ${ROVER_PROFILING_TASK_NETWORK_PROTOCOL_ANALYZE_SAMPLING_HTTP_DEFAULT_RESPONSE_ENCODING:UTF-8}
  # continuous profiling config
  continuous:
    # continuous related meters prefix name
    meter_prefix: ${ROVER_PROFILING_CONTINUOUS_METER_PREFIX:rover_con_p}
    # The interval of fetch metrics from the system, such as Process CPU, System Load, etc.
    fetch_interval: ${ROVER_PROFILING_CONTINUOUS_FETCH_INTERVAL:1s}
    # The interval of check metrics is reach the thresholds
    check_interval: ${ROVER_PROFILING_CONTINUOUS_CHECK_INTERVAL:5s}
    trigger:
      # the duration of the profiling task
      execute_duration: ${ROVER_PROFILING_CONTINUOUS_TRIGGER_EXECUTE_DURATION:10m}
      # the minimal duration between the execution of the same profiling task
      silence_duration: ${ROVER_PROFILING_CONTINUOUS_TRIGGER_SILENCE_DURATION:20m}

access_log:
  # Is active the access log monitoring
  active: ${ROVER_ACCESS_LOG_ACTIVE:false}
  # Exclude processes in the specified Kubernetes namespace. Multiple namespaces split by ","
  exclude_namespaces: ${ROVER_ACCESS_LOG_EXCLUDE_NAMESPACES:istio-system,cert-manager,kube-system}
  # Exclude processes in the specified cluster which defined in the process module. Multiple clusters split by ","
  exclude_cluster: ${ROVER_ACCESS_LOG_EXCLUDE_CLUSTER:}
  flush:
    # The max count of access log when flush to the backend
    max_count: ${ROVER_ACCESS_LOG_FLUSH_MAX_COUNT:10000}
    # The period of flush access log to the backend
    period: ${ROVER_ACCESS_LOG_FLUSH_PERIOD:5s}
    # Report one kernel log per operation of a message instead of one per socket syscall, with the
    # counters and the durations of the merged records summed.
    # A message carried by many syscalls costs one record per syscall, which dominates the access log
    # volume of large messages. Merging bounds it, and in exchange the backend loses the per syscall
    # timing: the metrics that are a sum stay correct, the read and write cpm metrics count merged
    # records instead of syscalls, and the *_time metrics become the time of a merged record.
    merge_kernel_logs: ${ROVER_ACCESS_LOG_FLUSH_MERGE_KERNEL_LOGS:false}
  sender:
    # The count of streams sending access logs to the backend at the same time. The backend consumes a stream
    # serially, so one stream bounds the access log rate; a batch that fits in one send still uses one stream.
    parallelism: ${ROVER_ACCESS_LOG_SENDER_PARALLELISM:8}
    # The most logs (protocol logs and kernel logs) one stream carries
    max_logs_per_send: ${ROVER_ACCESS_LOG_SENDER_MAX_LOGS_PER_SEND:2000}
    # The most logs waiting to be sent. Past it the oldest batches are dropped, counted and warned about,
    # instead of holding them in memory while the backend does not keep up. It is a count of logs, not bytes.
    # 0 does not bound them.
    max_pending_logs: ${ROVER_ACCESS_LOG_SENDER_MAX_PENDING_LOGS:200000}
  event_reader:
    # Wake the reader of the socket data and connection event rings once a per CPU ring holds this many
    # events instead of for every event; 0 wakes it for every event. The rings are flushed every flush_period,
    # so no event waits longer.
    wakeup_events: ${ROVER_ACCESS_LOG_EVENT_READER_WAKEUP_EVENTS:32}
    # How often the rings are flushed when wakeup_events or batch_size is set, and the longest a partial batch waits
    flush_period: ${ROVER_ACCESS_LOG_EVENT_READER_FLUSH_PERIOD:1s}
    # Hand the events to the analyzing partitions in batches of up to this many, collected until the ring is
    # drained or flush_period has passed, instead of one by one; 0 hands them one by one. The queue_size of the
    # partitions stays a count of events.
    batch_size: ${ROVER_ACCESS_LOG_EVENT_READER_BATCH_SIZE:64}
  bpf:
    # How the socket call programs attach: auto (from BPF trampolines or raw tracepoints where the kernel runs them,
    # from the syscall tracepoints and kprobes elsewhere), trampoline (auto without the check that the kernel runs
    # trampoline programs without preemption) or tracepoint (the syscall tracepoints and kprobes everywhere)
    attach_mode: ${ROVER_ACCESS_LOG_BPF_ATTACH_MODE:auto}
    # Where the remote address of a connect behind a DNAT is read: auto (fexit __nf_conntrack_confirm where it
    # attaches, otherwise a kprobe on it), confirm (the fexit only), kprobe (the kprobe only) or legacy (the kprobes
    # __nf_conntrack_hash_insert and nf_confirm)
    nat_hook: ${ROVER_ACCESS_LOG_BPF_NAT_HOOK:auto}
  kernel_metrics:
    # The L2/L3 metrics of the kernel logs of the reads and writes (the interface, the time in the IP layer, the
    # netfilter hooks, the neighbour resolution and the device queue) with the L4 duration, retransmits and transmitted
    # packages, taken by kprobes and tracepoints on the network stack. Off: the kernel logs carry the L4 package count
    # and size of each socket call only, and none of those programs is attached.
    l2_l3: ${ROVER_ACCESS_LOG_KERNEL_METRICS_L2_L3:true}
  connection_analyze:
    # The size of connection buffer on each CPU
    per_cpu_buffer: ${ROVER_ACCESS_LOG_CONNECTION_ANALYZE_PER_CPU_BUFFER:200KB}
    # The count of goroutines reading the connection event ring: one goroutine reads each ring, because the perf
    # library serialises the reads of a ring, so values above 1 are ignored
    parse_parallels: ${ROVER_ACCESS_LOG_CONNECTION_ANALYZE_PARSE_PARALLELS:1}
    # The count of parallel connection analyzer: a positive integer, or "auto" (or 0) for 2 x GOMAXPROCS
    # bounded to [2, 10]
    analyze_parallels: ${ROVER_ACCESS_LOG_CONNECTION_ANALYZE_PARALLELS:1}
    # The size of per paralleled analyzer queue
    queue_size: ${ROVER_ACCESS_LOG_CONNECTION_ANALYZE_QUEUE_SIZE:2000}
  protocol_analyze:
    # The size of the socket data perf buffer on each CPU, so the agent allocates this x the CPU count.
    # One socket data event is about 20KB, so 4MB holds roughly 200 events per CPU: enough for the reader
    # to be descheduled for a moment without the kernel dropping samples. Dropped samples are not a lost
    # request only: a lost HTTP/2 header block desynchronizes HPACK for the rest of that connection. The
    # agent logs "perf event queue(...) dropped N samples" when this is too small for the traffic.
    per_cpu_buffer: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_PER_CPU_BUFFER:4MB}
    # The count of goroutines reading the socket data rings: one goroutine reads each ring, because the perf
    # library serialises the reads of a ring (several only add a hand-off per event and deliver the events of a
    # connection out of order), so values above 1 are ignored
    parse_parallels: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_PARSE_PARALLELS:1}
    # The count of parallel protocol analyzer: a positive integer, or "auto" (or 0) for 2 x GOMAXPROCS
    # bounded to [2, 10]; GOMAXPROCS follows the CPU limit of the container
    analyze_parallels: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_PARALLELS:2}
    # The size of per paralleled analyzer queue: the events read from the perf buffer that wait to be appended to
    # their connection. It does not bound the memory of the analysis: an appended event keeps its data until its
    # message is analyzed or expires, which the memory protection below bounds. A full queue makes the reader stop
    # draining the perf buffer, which costs lost samples (counted).
    queue_size: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_QUEUE_SIZE:5000}
    # Analyze the buffered socket data of a partition as soon as this many data events are pending, instead
    # of only on the flush period, so the unparsed data of a partition stays bounded (each event holds a pooled
    # buffer of the size of its data, up to 20KB). 0 disables it. Lower values analyze more often, at a fixed cost
    # per pass and connection.
    trigger_events: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_TRIGGER_EVENTS:1000}
    # Memory protection: the socket data events held in memory may take at most this percent of the memory the
    # agent can be allocated (its cgroup limit, found from /proc/self/cgroup or by looking up our PID under the
    # kubepods hierarchy of the host cgroup tree, else the memory of the host); while they hold it, a new event is
    # dropped (counted) and its connection restarts at its next message. 0 disables it.
    max_memory_percent: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_MAX_MEMORY_PERCENT:80}
    # Do not upload the socket calls of cleartext HTTP/2 connections that carry only frames the parser never reads
    drop_h2c_unused_frame: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_DROP_H2C_UNUSED_FRAME:false}
    # Upload the socket calls of cleartext HTTP/2 connections that lie wholly inside the payload of a DATA frame as
    # their size alone, without their bytes, which the parser never reads. It follows the frames like
    # drop_h2c_unused_frame, with or without it.
    skip_h2c_data_payload: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_SKIP_H2C_DATA_PAYLOAD:false}
    # Send the skipped and tail-cut socket calls of cleartext HTTP/2 connections as compact records in per-CPU
    # batches (needs skip_h2c_data_payload and flush.merge_kernel_logs).
    batch_h2c_records: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_BATCH_H2C_RECORDS:false}
    # Summarise the socket calls of cleartext HTTP/2 connections that lie wholly inside a DATA payload per stream
    # instead of sending them (needs batch_h2c_records).
    summarize_h2c_payload: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_SUMMARIZE_H2C_PAYLOAD:false}
    # The HTTP logs carry the tracing context of their requests (the SkyWalking sw8 and the Zipkin b3 headers)
    analyze_trace_context: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_ANALYZE_TRACE_CONTEXT:true}
    # Decode the socket calls of an HTTP/1 connection that lie wholly inside a Content-Length body without their
    # bytes, which the parser only counts (the events take no data buffer)
    skip_http1_body_payload: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_SKIP_HTTP1_BODY_PAYLOAD:false}
    # Upload the socket calls of a cleartext HTTP/1 connection that lie wholly inside a Content-Length body or inside
    # the data of a chunk, or that come behind the head of a response delimited by the close, as an event without
    # content that carries their size, which the parser counts into the body.
    skip_http1_body_payload_bpf: ${ROVER_ACCESS_LOG_PROTOCOL_ANALYZE_SKIP_HTTP1_BODY_PAYLOAD_BPF:false}

pprof:
  # Is active the pprof
  active: ${ROVER_PPROF_ACTIVE:true}
  # The bind host of the pprof HTTP server, defaults to 127.0.0.1 so it only listens on the local host
  host: ${ROVER_PPROF_HOST:127.0.0.1}
  # The bind port of the pprof HTTP server
  port: ${ROVER_PPROF_PORT:6060}