# Traffic generator for the ambient scenarios. It runs INSIDE the ambient enabled
# namespace so every request traverses the ztunnel data path.
#
# fortio is used instead of wrk with `-keepalive=false` on purpose: the ztunnel
# correlation events(inbound leg tagging, outbound lb mappings) only fire on
# connection ESTABLISHMENT, so a keep-alive load would open a handful of
# connections and then go silent. The rate is deliberately MODERATE - a high rate
# closed connection flood rotates the agent's periodic stats lines out of the
# retained log window before the verify phase can read them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficgenerator
  labels:
    app: trafficgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trafficgenerator
  template:
    metadata:
      labels:
        app: trafficgenerator
    spec:
      containers:
        - name: trafficgenerator
          image: fortio/fortio
          args:
            - load
            - -qps
            - "6"
            - -c
            - "3"
            - -t
            - 3600s
            - -keepalive=false
            - http://productpage:9080/productpage
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
