# Every bookinfo service must be discovered on the K8S_SERVICE layer even though no
# workload has an envoy sidecar - the whole inventory comes from the ztunnel data path.
#
# An ambient service sits on BOTH layers and both are asserted: besides K8S_SERVICE, the
# backend's prepareDispatchForZtunnelMesh() also registers it on MESH because the connection
# carries a ZTunnel attachment. `contains` is used on `layers` only so the two match
# regardless of the order they are returned in - a service with just one of them fails here.
# The outer `contains` ignores the infra services(istiod, elasticsearch, kube-dns, ...).
{{- contains . }}
- id: {{ b64enc "details.default" }}.1
  name: details.default
  group: ""
  shortname: details.default
  layers:
  {{- contains .layers }}
    - K8S_SERVICE
    - MESH
  {{- end }}
  normal: true
- id: {{ b64enc "reviews.default" }}.1
  name: reviews.default
  group: ""
  shortname: reviews.default
  layers:
  {{- contains .layers }}
    - K8S_SERVICE
    - MESH
  {{- end }}
  normal: true
- id: {{ b64enc "productpage.default" }}.1
  name: productpage.default
  group: ""
  shortname: productpage.default
  layers:
  {{- contains .layers }}
    - K8S_SERVICE
    - MESH
  {{- end }}
  normal: true
- id: {{ b64enc "ratings.default" }}.1
  name: ratings.default
  group: ""
  shortname: ratings.default
  layers:
  {{- contains .layers }}
    - K8S_SERVICE
    - MESH
  {{- end }}
  normal: true
{{- end }}
