# Ambient WITH a waypoint proxy. It reuses the pure ambient case's cluster, backend, rover
# and traffic definitions and only adds a waypoint in front of the `details` service, so the
# productpage -> details hop becomes
#     productpage -> ztunnel -> waypoint(L7) -> ztunnel -> details
# instead of a single ztunnel proxied L4 hop. The interesting part for rover is that the
# waypoint is an ordinary in-mesh workload: its legs must be attributed to the waypoint
# rather than collapsed into the caller or the callee, and the plain ztunnel hops in the
# same cluster(productpage -> reviews -> ratings) must keep working unchanged.
# The setup is the pure ambient case's, plus the waypoint steps from the SkyWalking ambient
# e2e(test/e2e-v2/cases/istio/ambient-als): `istioctl waypoint apply` followed by labelling
# the fronted Service with istio.io/use-waypoint.
setup:
  env: kind
  file: kind.yaml
  init-system-environment: ../../base/env
  kind:
    import-images:
      - apache/skywalking-rover:latest
    expose-ports:
      - namespace: istio-system
        resource: service/skywalking-oap
        port: 12800
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e/base/scripts/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e/base/scripts/prepare/setup-e2e-shell/install.sh swctl
    - name: install kubectl
      command: bash test/e2e/base/scripts/prepare/setup-e2e-shell/install.sh kubectl
    - name: install istio
      command: |
        bash test/e2e/base/scripts/prepare/setup-e2e-shell/install.sh istioctl
        istioctl install -y --set profile=ambient --skip-confirmation
        kubectl get crd gateways.gateway.networking.k8s.io &> /dev/null || \
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
        kubectl label namespace default istio.io/dataplane-mode=ambient
        kubectl -n istio-system rollout status daemonset/ztunnel --timeout=600s
        kubectl -n istio-system rollout status daemonset/istio-cni-node --timeout=600s
    - name: install waypoint
      command: istioctl waypoint apply -n default --name bookinfo-waypoint && sleep 10
      wait:
        - namespace: default
          resource: deployments/bookinfo-waypoint
          for: condition=available
    - name: Install helm
      command: bash test/e2e/base/scripts/prepare/setup-e2e-shell/install.sh helm
    - name: Install ECK operator CRDs
      command: |
        rm -rf skywalking-helm
        helm pull oci://ghcr.io/apache/skywalking-helm/skywalking-helm \
          --version "0.0.0-${SW_KUBERNETES_COMMIT_SHA}" --untar
        helm dep up skywalking-helm
        tar xzf skywalking-helm/charts/eck-operator-3.3.1.tgz -C /tmp eck-operator/charts/eck-operator-crds
        helm -n istio-system install eck-crds /tmp/eck-operator/charts/eck-operator-crds \
          --create-namespace
    - name: Install SkyWalking
      command: |
        helm -n istio-system install skywalking \
          oci://ghcr.io/apache/skywalking-helm/skywalking-helm \
          --version "0.0.0-${SW_KUBERNETES_COMMIT_SHA}" \
          --set fullnameOverride=skywalking \
          --set eck-operator.installCRDs=false \
          --set oap.env.SW_HEALTH_CHECKER=default \
          --set oap.replicas=1 \
          --set ui.enabled=false \
          --set oap.image.tag=${SW_OAP_COMMIT} \
          --set oap.image.repository=ghcr.io/apache/skywalking/oap \
          --set oap.storageType=elasticsearch \
          -f test/e2e/base/kubernetes-values.yaml \
          -f test/e2e/cases/ambient/values.yaml
      wait:
        - namespace: istio-system
          resource: deployments/skywalking-oap
          for: condition=available
    - name: Deploy demo services
      command: |
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/${ISTIO_VERSION}/samples/bookinfo/platform/kube/bookinfo.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
    - name: Route the details service through the waypoint
      command: kubectl label service -n default details istio.io/use-waypoint=bookinfo-waypoint --overwrite
    - name: Install SkyWalking Rover
      command: |
        envsubst < test/e2e/cases/ambient/rover.yaml | kubectl apply -f -
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
    - name: Status of istio mesh
      command: istioctl zc all && sleep 15 # sleep for waiting the rover ready to monitoring all services
    - name: Generate traffic
      path: traffic-gen.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
  timeout: 40m

verify:
  retry:
    count: 60
    interval: 10s
  cases:
    # service list: the waypoint is itself a monitored workload alongside bookinfo
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql service ls
      expected: expected-waypoint/service.yml
    # the call graph with the waypoint on the productpage -> details hop, while the plain
    # ztunnel hops(productpage -> reviews -> ratings) are unaffected
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql dependency global --layer=K8S_SERVICE
      expected: expected-waypoint/dependency-services.yml
    # service instance list
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=productpage.default
      expected: expected-waypoint/service-instance.yml

    # metrics still flow for both the waypointed and the plain ztunnel hops
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=kubernetes_service_connect_cpm --service-name=productpage.default
      expected: expected-waypoint/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=kubernetes_service_accept_cpm --service-name=reviews.default
      expected: expected-waypoint/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=kubernetes_service_http_call_cpm --service-name=reviews.default
      expected: expected-waypoint/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=kubernetes_service_relation_connect_cpm --service-name=productpage.default --dest-service-name=reviews.default
      expected: expected-waypoint/metrics-has-value.yml

    # ---- rover side health of the ambient(ztunnel) correlation, read from its own logs ----
    - query: bash test/e2e/cases/ambient/verify/ztunnel-binding.sh
      expected: verify/expected/ztunnel-binding.yml
    - query: bash test/e2e/cases/ambient/verify/resolution-health.sh
      expected: verify/expected/resolution-health.yml
    - query: bash test/e2e/cases/ambient/verify/identity-source.sh
      expected: verify/expected/identity-source.yml
