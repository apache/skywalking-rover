# HTTP/2 server (h2c, gRPC, HTTP/2 over TLS) and a client that keeps long lived connections to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http2-server
  labels:
    app: http2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http2-server
  template:
    metadata:
      labels:
        app: http2-server
    spec:
      containers:
        - name: http2-server
          image: ${IMAGE_NAME}
          imagePullPolicy: IfNotPresent
          args: ["-mode", "server"]
          ports:
            - containerPort: 8080
              name: h2c
            - containerPort: 9090
              name: grpc
            - containerPort: 8443
              name: https
---
apiVersion: v1
kind: Service
metadata:
  name: http2-server
  labels:
    app: http2-server
spec:
  selector:
    app: http2-server
  ports:
    - port: 8080
      targetPort: 8080
      name: h2c
    - port: 9090
      targetPort: 9090
      name: grpc
    - port: 8443
      targetPort: 8443
      name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http2-client
  labels:
    app: http2-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http2-client
  template:
    metadata:
      labels:
        app: http2-client
    spec:
      containers:
        - name: http2-client
          image: ${IMAGE_NAME}
          imagePullPolicy: IfNotPresent
          # start-delay: give the rover time to discover the pod before the long lived connections are opened
          args: ["-mode", "client", "-target", "http2-server", "-interval", "500ms", "-start-delay", "20s"]
---
# the client needs a Service too, otherwise the rover process finder cannot name it
apiVersion: v1
kind: Service
metadata:
  name: http2-client
  labels:
    app: http2-client
spec:
  selector:
    app: http2-client
  ports:
    - port: 65000
      targetPort: 65000
      name: unused
